name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Generar el resumen
        run: python src/resumen.py
      - name: Verificar enlaces de la documentación
        run: python scripts/verificar_enlaces.py

  matriz:
    name: matriz (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python src/resumen.py
      - name: Guardar resumen.json como artefacto (7 días)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: resumen-json
          path: docs/data/resumen.json
          retention-days: 7
