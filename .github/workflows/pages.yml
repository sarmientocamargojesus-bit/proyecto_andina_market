name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: Humo antes de publicar (JSON del repositorio = CSV)
        run: python scripts/humo.py

  desplegar:
    needs: pruebas          # solo se publica si las pruebas pasan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: despliegue
        uses: actions/deploy-pages@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Humo después de publicar (sitio = CSV)
        run: python scripts/humo.py "${{ steps.despliegue.outputs.page_url }}"
