name: Release

# La Release (y su tag) la crea una persona en GitHub:
#   Releases → Draft a new release → tag vX.Y.Z → Publish release
# o desde su equipo con: git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z
# Este workflow verifica el tag y adjunta los paquetes generados desde él.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  adjuntar:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ejecutar pruebas sobre el tag
        run: python -m unittest discover -s tests -v
      - name: Generar ZIP (git archive) y bundle verificado
        run: |
          git archive --format=zip --prefix="proyecto_andina_market-${TAG}/" \
            -o "proyecto_andina_market-${TAG}.zip" "${TAG}"
          git bundle create "proyecto_andina_market-${TAG}.bundle" --all
          git bundle verify "proyecto_andina_market-${TAG}.bundle"
          sha256sum proyecto_andina_market-${TAG}.* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Adjuntar a la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${TAG}" \
            "proyecto_andina_market-${TAG}.zip" "proyecto_andina_market-${TAG}.bundle" SHA256SUMS.txt --clobber
